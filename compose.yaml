services:
  postgres:
    image: postgres:16-alpine
    container_name: outbound-platform-postgres
    restart: unless-stopped
    env_file:
      - .env.postgres.local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - outbound_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  outbound_postgres_data:
    name: outbound-platform-postgres-data
