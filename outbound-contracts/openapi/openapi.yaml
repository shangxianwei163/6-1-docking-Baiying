openapi: 3.1.0
info:
  title: 6+1 Outbound Platform API
  version: 2.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    6+1 智能外呼平台的 OpenAPI 3.1 契约。ERP/CRM 新增外呼统一使用 `/openapi/v2` 批次/GUID 契约；
    `/api/v1` 面向运营后台、内部 Worker 与百应回调。
servers:
  - url: https://{apiHost}
    description: 生产环境占位域名，部署时替换为阿里云 ALB/WAF 对外域名
    variables:
      apiHost:
        default: api.outbound.invalid
        description: 实际部署域名
security:
  - ConsoleBearer: []
tags:
  - name: Outbound Tasks
    description: ERP/CRM 外呼批次受理与查询
  - name: Baiying Callbacks
    description: 百应供应商回调入口
paths:
  /api/v1/mappings:
    get:
      operationId: listPublishedMappings
      summary: 获取当前已发布映射快照
      responses:
        '200':
          description: 当前映射规则
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [rules]
                    properties:
                      rules:
                        type: array
                        items: { $ref: '#/components/schemas/MappingRule' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/mappings/drafts:
    get:
      operationId: listMappingDrafts
      summary: 获取待发布映射草稿
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: saveMappingDraft
      summary: 保存 ERP/CRM 直接映射草稿
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MappingDraftInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: 变量不在百应 4.10 成功快照内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/mappings/drafts/remove:
    post:
      operationId: stageMappingRemoval
      summary: 将已发布映射标记为待移除
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baiyingVariableName, removalReason]
              properties:
                baiyingVariableName: { type: string, maxLength: 128 }
                removalReason: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/mappings/publish:
    post:
      operationId: publishMappings
      summary: 原子发布全部映射草稿并生成不可变版本
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisherId, changeSummary]
              properties:
                publisherId: { type: string, maxLength: 128 }
                changeSummary: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/mapping-versions:
    get:
      operationId: listMappingVersions
      summary: 获取不可变映射版本记录
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/scenes/readiness:
    get:
      operationId: listSceneReadiness
      summary: 获取场景变量覆盖和阻断状态
      responses:
        '200':
          description: 场景就绪状态
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [scenes]
                    properties:
                      scenes:
                        type: array
                        items: { $ref: '#/components/schemas/SceneReadiness' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/planned-tasks:
    get:
      operationId: listPlannedTasks
      summary: 实时查询百应复杂任务列表 2.0，并合并平台数据分类绑定
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: status,
            in: query,
            schema:
              {
                enum: [ALL, DRAFT, UNSTART, START, FINISH, PAUSE],
                default: ALL,
              },
          }
        - {
            name: pageNum,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: 百应计划任务分页结果
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [total, pages, pageNum, pageSize, tasks]
                    properties:
                      total: { type: integer, minimum: 0 }
                      pages: { type: integer, minimum: 0 }
                      pageNum: { type: integer, minimum: 0 }
                      pageSize: { type: integer, minimum: 1 }
                      tasks:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/PlannedTask' },
                        }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/source-categories:
    get:
      operationId: listSourceCategories
      summary: 获取 ERP 或 CRM 已同步的数据分类
      parameters:
        - name: sourceSystem
          in: query
          schema: { enum: [ERP, CRM] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/planned-task-category-bindings:
    post:
      operationId: savePlannedTaskCategoryBinding
      summary: 保存百应计划与 ERP/CRM 数据分类的绑定
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/PlannedTaskCategoryBindingInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/scripts:
    get:
      operationId: listBaiyingScripts
      summary: 实时查询百应话术列表，并合并平台业务绑定
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: robotStatus,
            in: query,
            description: '百应查询范围：0 全部，1 已上线，2 发布过',
            schema: { type: integer, enum: [0, 1, 2], default: 0 },
          }
        - {
            name: pageNum,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: 百应话术分页结果
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [total, pages, pageNum, pageSize, scripts]
                    properties:
                      total: { type: integer, minimum: 0 }
                      pages: { type: integer, minimum: 0 }
                      pageNum: { type: integer, minimum: 0 }
                      pageSize: { type: integer, minimum: 1 }
                      scripts:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/BaiyingScript' },
                        }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/script-bindings:
    post:
      operationId: saveScriptBinding
      summary: 保存百应话术与数据分类、影楼及线路的绑定
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptBindingInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/variable-sync-jobs:
    post:
      operationId: requestVariableSync
      summary: 请求异步同步百应 4.10 话术变量
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '202':
          description: 同步任务已写入可靠出站事件
          content:
            application/json:
              schema:
                type: object
                required: [requestId, data]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [jobId, status, requestedAt]
                    properties:
                      jobId: { type: string, format: uuid }
                      status: { const: QUEUED }
                      requestedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/internal/scene-variable-observations:
    post:
      operationId: recordSceneVariableObservations
      summary: 变量同步 worker 回写 4.10 成功快照
      security:
        - WorkerSecretHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    { $ref: '#/components/schemas/SceneVariableObservation' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/internal/source-categories:
    post:
      operationId: syncSourceCategories
      summary: ERP/CRM 适配器回写数据分类目录
      security:
        - WorkerSecretHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observations]
              properties:
                observations:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    { $ref: '#/components/schemas/SourceCategoryObservation' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /openapi/v2/outbound/tasks:
    post:
      tags: [Outbound Tasks]
      operationId: createOutboundBatchV2
      summary: 按三级分类创建一个平台外呼批次
      description: |
        ERP/CRM 提交一个逻辑批次；平台按实际话术和线路路由拆成一个或多个百应任务。
        所有百应子任务全部创建且导入成功后才统一放行启动。source=0 表示 ERP，source=1 表示 CRM，
        并且必须与请求 Token 的来源一致。同一次 HTTP 重试必须复用原 GUID、Idempotency-Key 和完全相同的正文；
        新一次业务发起必须为每个号码生成新的 GUID。运行期间幂等记录不过期，批次终态后保留 180 天。
      security:
        - AccessTokenHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/CreateOutboundBatchRequestV2' }
            examples:
              erpBatch:
                $ref: '#/components/examples/ErpCreateBatchRequestV2'
      responses:
        '202':
          description: 平台批次及全部执行子任务已原子受理
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAcceptedEnvelopeV2' }
              examples:
                accepted:
                  $ref: '#/components/examples/BatchAcceptedResponseV2'
        '400': { $ref: '#/components/responses/ExternalError' }
        '401': { $ref: '#/components/responses/ExternalError' }
        '403': { $ref: '#/components/responses/ExternalError' }
        '404': { $ref: '#/components/responses/ExternalError' }
        '409': { $ref: '#/components/responses/ExternalError' }
        '413': { $ref: '#/components/responses/ExternalError' }
        '422': { $ref: '#/components/responses/ExternalError' }
        '503': { $ref: '#/components/responses/ExternalError' }
  /openapi/v2/outbound/batches/{batchId}:
    get:
      tags: [Outbound Tasks]
      operationId: getOutboundBatchV2
      summary: 查询平台批次及其百应执行子任务
      security:
        - AccessTokenHeader: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 平台批次状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDetailEnvelopeV2' }
        '401': { $ref: '#/components/responses/ExternalError' }
        '404': { $ref: '#/components/responses/ExternalError' }
  /api/v1/callbacks/baiying:
    post:
      tags: [Baiying Callbacks]
      operationId: receiveBaiyingCallback
      summary: 接收百应任务和单次呼叫回调
      description: |
        仅供百应调用。生产环境还必须在阿里云 WAF/ALB 限制官方来源 IP。
        平台在原始正文与去重键持久化成功后立即 ACK；业务处理、计费、录音归档和外部投递均异步执行。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaiyingCallbackEnvelope' }
      responses:
        '200':
          description: 原始回调已可靠接收；重复报文同样返回成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BaiyingCallbackAck' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
webhooks:
  outboundCallResultV2:
    post:
      operationId: onOutboundCallResultV2
      summary: ERP/CRM 接收单号码最终业务结果
      description: |
        每个 GUID 只投递一次最终业务结果。短期兼容窗口内同时发送 guid 与 externalCustomerId，
        两者值完全相同；兼容窗口结束后移除 externalCustomerId。result_complete=false 表示平台只能形成补偿结果，
        未获得完整的百应真实回调数据。
      security:
        - CallbackTimestampHeader: []
          CallbackSignatureHeader: []
      parameters:
        - $ref: '#/components/parameters/PlatformEventId'
        - $ref: '#/components/parameters/CallbackTimestamp'
        - $ref: '#/components/parameters/CallbackSignature'
        - name: X-Contract-Version
          in: header
          required: true
          schema: { const: '2.0' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundCallResultV2' }
            examples:
              result:
                $ref: '#/components/examples/OutboundCallResultV2'
      responses:
        '200': { $ref: '#/components/responses/CallbackAccepted' }
  outboundRecordingAvailableBatch:
    post:
      operationId: onOutboundRecordingAvailableBatch
      summary: ERP/CRM 接收录音可下载批次
      security:
        - CallbackTimestampHeader: []
          CallbackSignatureHeader: []
      parameters:
        - $ref: '#/components/parameters/PlatformEventId'
        - $ref: '#/components/parameters/CallbackTimestamp'
        - $ref: '#/components/parameters/CallbackSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/RecordingAvailableBatchEvent' }
      responses:
        '200': { $ref: '#/components/responses/CallbackAccepted' }
components:
  securitySchemes:
    ConsoleBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 运营后台管理员或服务账户访问令牌。
    WorkerSecretHeader:
      type: apiKey
      in: header
      name: X-Worker-Secret
      description: 仅在阿里云 VPC 内使用的 Worker 共享凭证；生产建议迁移为短期服务身份。
    AccessTokenHeader:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 在影楼管理详情中查看并复制的 ERP 或 CRM 固定请求 Token。
    CallbackTimestampHeader:
      type: apiKey
      in: header
      name: X-Timestamp
      description: 平台向 ERP/CRM 回传事件时生成的 Unix 毫秒时间戳。
    CallbackSignatureHeader:
      type: apiKey
      in: header
      name: X-Signature
      description: 平台向 ERP/CRM 回传事件时使用的 HMAC-SHA256 签名。
  headers:
    RequestId:
      description: 平台请求追踪 ID。
      schema: { type: string, maxLength: 128 }
  parameters:
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: 当前管理员或服务账户标识；正式身份认证接入后由网关注入。
      schema: { type: string, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方生成的追踪 ID；缺省时由平台生成并在响应头及响应体中返回。
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键；同一客户端内唯一，批次终态后至少保留 180 天。
      schema: { type: string, minLength: 8, maxLength: 128 }
    PlatformEventId:
      name: X-Platform-Event-Id
      in: header
      required: true
      description: 回调事件唯一标识，用作接收方幂等键；录音回调中与 Body 的 eventId 相同。
      schema: { type: string, format: uuid }
    CallbackTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: 平台生成回调时的 Unix 毫秒时间戳。
      schema: { type: string, pattern: '^\d{13}$' }
    CallbackSignature:
      name: X-Signature
      in: header
      required: true
      description: 使用该影楼来源端点密钥计算的 Base64 HMAC-SHA256 签名。
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema:
            type: object
            required: [requestId, data]
            properties:
              requestId: { type: string }
              data: { type: object, additionalProperties: true }
    Error:
      description: 请求失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ExternalError:
      description: ERP/CRM API 请求失败；以响应中的 code 判断业务原因。
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExternalErrorEnvelope' }
          examples:
            mappingConflict:
              value:
                code: DATA_CATEGORY_SCRIPT_CONFLICT
                message: 本次数据分类匹配到多个话术，请拆分后重新提交
                requestId: 9bba018d-36b2-478d-af0a-af3f7d573937
                details:
                  categories: [SS1, SS2]
                  matchedRobotDefIds: ['5421020', '5390020']
    CallbackAccepted:
      description: 事件已完成幂等持久化；重复事件也应返回成功。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CallbackAck' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    ExternalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_FAILED
            - REPLAY_DETECTED
            - IDEMPOTENCY_CONFLICT
            - STUDIO_NOT_FOUND
            - STUDIO_DISABLED
            - CALLBACK_CONFIG_MISSING
            - PRICING_NOT_CONFIGURED
            - INSUFFICIENT_BALANCE
            - PHONE_INVALID
            - PHONE_DUPLICATED
            - GUID_DUPLICATED
            - DATA_CATEGORY_NOT_FOUND
            - DATA_CATEGORY_AMBIGUOUS
            - DATA_CATEGORY_SCRIPT_UNBOUND
            - DATA_CATEGORY_SCRIPT_CONFLICT
            - DATA_CATEGORY_LINE_CONFLICT
            - LINE_NOT_AVAILABLE
            - MAPPING_NOT_READY
            - MAPPING_VALUE_INVALID
            - TASK_NOT_FOUND
            - COMMAND_NOT_ALLOWED
            - RECORDING_NOT_FOUND
            - RECORDING_NOT_ARCHIVED
            - RECORDING_EXPIRED
            - RECORDING_OBJECT_UNAVAILABLE
            - SERVICE_TEMPORARILY_UNAVAILABLE
        message: { type: string, minLength: 1, maxLength: 1000 }
        requestId: { type: string, minLength: 1, maxLength: 128 }
        details: { type: object, additionalProperties: true }
    SourceSystem:
      type: string
      enum: [ERP, CRM]
    DynamicCustomerVariableV2:
      description: 单个动态变量值；null 表示不向百应导入该值。
      oneOf:
        - { type: string, maxLength: 8192 }
        - { type: number }
        - { type: boolean }
        - { type: 'null' }
    OutboundCustomerInfoV2:
      type: object
      required: [phone, guid]
      properties:
        phone:
          type: string
          pattern: '^\+?[1-9]\d{6,14}$'
          description: 批次内归一化后不可重复。
        guid:
          type: string
          minLength: 1
          maxLength: 128
          description: 本次业务发起的号码唯一值；以后再次发起同一号码时必须生成新 GUID。
        customer_name: { type: [string, 'null'], maxLength: 200 }
      additionalProperties:
        $ref: '#/components/schemas/DynamicCustomerVariableV2'
      description: |
        除 phone、guid、customer_name 外均视为动态业务变量，不限定为示例中的六个字段，也不设业务字段数量上限。
        平台仍执行单变量名 128 UTF-8 字节、单值 8 KiB、单号码变量总量 128 KiB 的安全限制；
        sx_*、__proto__、constructor、prototype 为保留名，不允许调用方传入。
    OutboundCustomerGroupV2:
      type: object
      additionalProperties: false
      required: [c_level, c_info_list]
      properties:
        c_level: { type: string, maxLength: 128 }
        c_info_list:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: '#/components/schemas/OutboundCustomerInfoV2' }
    CreateOutboundBatchRequestV2:
      type: object
      additionalProperties: false
      required:
        [main_category, sub_category, source, company_code, customer_list]
      properties:
        main_category: { type: string, minLength: 1, maxLength: 200 }
        sub_category: { type: string, minLength: 1, maxLength: 200 }
        source:
          type: integer
          enum: [0, 1]
          description: 0=ERP，1=CRM；必须与请求 Token 的来源一致。
        company_code:
          type: string
          minLength: 1
          maxLength: 64
          description: 影楼 MC code；只用于识别发起影楼。
        customer_list:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: '#/components/schemas/OutboundCustomerGroupV2' }
      description: |
        main_category、sub_category、c_level 组成三级分类。整个批次最多 10000 个号码，
        GUID 和归一化手机号均须在批次内唯一；整个 JSON 请求体不得超过 25 MiB。
    BatchTaskSummaryV2:
      type: object
      additionalProperties: false
      required: [task_id, task_no, phone_count, status_url]
      properties:
        task_id: { type: string, format: uuid }
        task_no: { type: string, pattern: '^PT-\d{8}-\d{5,}$' }
        phone_count: { type: integer, minimum: 1, maximum: 10000 }
        status_url: { type: string, pattern: '^/openapi/v1/outbound/tasks/' }
    BatchAcceptedV2:
      type: object
      additionalProperties: false
      required:
        [batch_id, execution_status, phone_count, task_count, tasks, status_url]
      properties:
        batch_id: { type: string, format: uuid }
        execution_status: { const: ACCEPTED }
        phone_count: { type: integer, minimum: 1, maximum: 10000 }
        task_count: { type: integer, minimum: 1 }
        tasks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BatchTaskSummaryV2' }
        status_url: { type: string, pattern: '^/openapi/v2/outbound/batches/' }
    BatchAcceptedEnvelopeV2:
      type: object
      additionalProperties: false
      required: [code, message, request_id, data]
      properties:
        code: { const: BATCH_ACCEPTED }
        message: { type: string }
        request_id: { type: string }
        data: { $ref: '#/components/schemas/BatchAcceptedV2' }
    IntakeBatchStatusV2:
      enum:
        [
          ACCEPTED,
          PREPARING,
          RUNNING,
          PARTIAL_FAILED,
          COMPLETED,
          FAILED,
          CANCELLED,
        ]
    BatchDetailV2:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - source
        - company_code
        - main_category
        - sub_category
        - execution_status
        - phone_count
        - task_count
        - tasks
        - created_at
        - completed_at
      properties:
        batch_id: { type: string, format: uuid }
        source: { type: integer, enum: [0, 1] }
        company_code: { type: string, maxLength: 64 }
        main_category: { type: string, maxLength: 200 }
        sub_category: { type: string, maxLength: 200 }
        execution_status: { $ref: '#/components/schemas/IntakeBatchStatusV2' }
        phone_count: { type: integer, minimum: 1, maximum: 10000 }
        task_count: { type: integer, minimum: 1 }
        tasks:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/BatchTaskSummaryV2' }
              - type: object
                required: [execution_status]
                properties:
                  execution_status:
                    { $ref: '#/components/schemas/TaskExecutionStatus' }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    BatchDetailEnvelopeV2:
      type: object
      additionalProperties: false
      required: [code, message, request_id, data]
      properties:
        code: { const: OK }
        message: { const: success }
        request_id: { type: string }
        data: { $ref: '#/components/schemas/BatchDetailV2' }
    TaskExecutionStatus:
      type: string
      enum:
        - ACCEPTED
        - BAIYING_CREATING
        - BAIYING_CREATED
        - IMPORTING
        - IMPORTED
        - STARTING
        - CALLING
        - PAUSED
        - CALL_COMPLETED
        - RECONCILING
        - COMPLETED
        - CREATE_FAILED
        - IMPORT_FAILED
        - START_FAILED
        - CANCELLED
        - TERMINATED
    RecordingDeliveryItem:
      type: object
      additionalProperties: false
      required:
        [
          recordingId,
          platformCallId,
          baiyingCallInstanceId,
          kind,
          contentType,
          sizeBytes,
          sha256,
          downloadUrl,
          expiresAt,
        ]
      properties:
        recordingId: { type: string, format: uuid }
        platformCallId: { type: string, format: uuid }
        baiyingCallInstanceId: { type: string, minLength: 1, maxLength: 64 }
        kind: { enum: [FULL, USER_ONLY] }
        contentType: { type: string, minLength: 1, maxLength: 128 }
        sizeBytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        downloadUrl: { type: string, format: uri, pattern: '^https://' }
        expiresAt: { type: string, format: date-time }
    PlatformEventBase:
      type: object
      required:
        [
          schemaVersion,
          eventId,
          eventType,
          occurredAt,
          sourceSystem,
          mcCode,
          taskNo,
        ]
      properties:
        schemaVersion: { const: '1.0' }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        mcCode: { type: string, minLength: 1, maxLength: 64 }
        taskNo: { type: string, pattern: '^PT-\d{8}-\d{5,}$' }
    OutboundCallResultV2:
      type: object
      additionalProperties: false
      required:
        - guid
        - externalCustomerId
        - phone_masked
        - call_status
        - finish_status
        - result_complete
        - collected_variables
        - task_results
      properties:
        guid: { type: string, minLength: 1, maxLength: 128 }
        externalCustomerId:
          type: string
          minLength: 1
          maxLength: 128
          deprecated: true
          description: 临时兼容字段，当前必须与 guid 相同，兼容窗口结束后移除。
        phone_masked: { type: string, minLength: 1, maxLength: 32 }
        call_status:
          { enum: [ANSWERED, NO_ANSWER, BUSY, REJECTED, FAILED, UNKNOWN] }
        finish_status: { type: [integer, 'null'] }
        result_complete:
          type: boolean
          description: true=百应真实完成回调；false=补偿/对账形成的不完整最终结果。
        collected_variables:
          type: object
          additionalProperties: true
          description: 仅来自百应 callInstance.collectProperties，不混入导入参数。
        task_results:
          type: array
          items: { type: object, additionalProperties: true }
          description: 来自百应 data.taskResult。
    RecordingAvailableBatchEvent:
      allOf:
        - { $ref: '#/components/schemas/PlatformEventBase' }
        - type: object
          required:
            [eventType, baiyingCallJobId, batchNo, isLastBatch, recordings]
          properties:
            eventType: { const: OUTBOUND_RECORDING_AVAILABLE_BATCH }
            baiyingCallJobId: { type: string, minLength: 1, maxLength: 64 }
            batchNo: { type: integer, minimum: 1 }
            isLastBatch: { type: boolean }
            recordings:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: '#/components/schemas/RecordingDeliveryItem' }
    CallbackAck:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { const: 200 }
        message: { const: success }
    BaiyingCallbackEnvelope:
      type: object
      required: [code, data, resultMsg]
      properties:
        code: { type: number }
        data:
          type: object
          required: [callbackType, data]
          properties:
            callbackType: { enum: [CALL_INSTANCE_RESULT, JOB_INFO_RESULT] }
            data: { type: object, additionalProperties: true }
          additionalProperties: true
        resultMsg: { type: string }
      additionalProperties: true
      description: 平台保存完整原始正文；这里只约束路由所需的最小稳定字段。
    BaiyingCallbackAck:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { const: 200 }
    MappingDraftInput:
      type: object
      required: [baiyingVariableName, transformConfig, emptyPolicy]
      properties:
        baiyingVariableName:
          type: string
          maxLength: 128
          description: 必须存在于百应 4.10 的成功同步快照，禁止手工创造变量名。
        erpField: { type: [string, 'null'], maxLength: 128 }
        crmField: { type: [string, 'null'], maxLength: 128 }
        transformConfig: { $ref: '#/components/schemas/TransformConfig' }
        emptyPolicy:
          enum: [BLOCK, DEFAULT, OMIT]
          description: 空值阻断、采用版本化默认值或省略该百应变量。
        defaultValue: { type: [string, 'null'], maxLength: 1000 }
      anyOf:
        - required: [erpField]
        - required: [crmField]
    MappingRule:
      allOf:
        - $ref: '#/components/schemas/MappingDraftInput'
        - type: object
          required: [id, status, version]
          properties:
            id: { type: string, format: uuid }
            status: { enum: [PUBLISHED, REMOVED] }
            version: { type: integer, minimum: 1 }
    TransformConfig:
      oneOf:
        - type: object
          required: [type, mode]
          properties:
            type: { const: TEXT }
            mode: { enum: [TRIM, PRESERVE, UPPERCASE, LOWERCASE] }
        - type: object
          required: [type, outputFormat]
          properties:
            type: { const: DATE }
            outputFormat: { enum: [YYYY-MM-DD, YYYY年MM月DD日, MM/DD/YYYY] }
        - type: object
          required: [type, inputUnit, decimalPlaces]
          properties:
            type: { const: MONEY }
            inputUnit: { enum: [YUAN, CENT] }
            decimalPlaces: { enum: [0, 2] }
        - type: object
          required: [type, values]
          properties:
            type: { const: ENUM }
            values: { type: object, additionalProperties: { type: string } }
        - type: object
          required: [type, template]
          properties:
            type: { const: TEMPLATE }
            template: { type: string }
    SceneVariableObservation:
      type: object
      required:
        [companyId, robotDefId, sceneDefId, sceneName, variables, syncedAt]
      properties:
        companyId: { type: string, maxLength: 64 }
        robotDefId: { type: string, maxLength: 128 }
        sceneDefId: { type: string, maxLength: 128 }
        sceneName: { type: string, maxLength: 200 }
        variables:
          type: array
          maxItems: 500
          items: { type: string, maxLength: 128 }
        syncedAt: { type: string, format: date-time }
    SceneReadiness:
      type: object
      required:
        [
          sceneDefId,
          robotDefId,
          sceneName,
          companyCount,
          status,
          variables,
          mappedVariables,
          expectedVariables,
          missingVariables,
        ]
      properties:
        sceneDefId: { type: string }
        robotDefId: { type: string }
        sceneName: { type: string }
        companyCount: { type: integer, minimum: 0 }
        status:
          {
            enum:
              [ACTIVE, PENDING_MAPPING, DRIFT_DETECTED, STALE_SYNC, DISABLED],
          }
        variables: { type: array, items: { type: string } }
        mappedVariables: { type: integer, minimum: 0 }
        expectedVariables: { type: integer, minimum: 0 }
        missingVariables: { type: array, items: { type: string } }
        lastSuccessfulSyncAt: { type: [string, 'null'], format: date-time }
        issueSummary: { type: [string, 'null'] }
        publishedMappingVersion: { type: [integer, 'null'], minimum: 1 }
    PlannedTask:
      type: object
      required:
        [
          id,
          name,
          workflowExecuteStatus,
          workflowType,
          startTime,
          endTime,
          categoryBinding,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        workflowExecuteStatus: { enum: [DRAFT, UNSTART, START, FINISH, PAUSE] }
        workflowType: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        categoryBinding:
          oneOf:
            - { $ref: '#/components/schemas/PlannedTaskCategoryBinding' }
            - { type: 'null' }
    PlannedTaskCategoryBindingInput:
      type: object
      required: [workflowId, sourceSystem, sourceCategoryId, categoryPath]
      properties:
        workflowId: { type: string, maxLength: 128 }
        sourceSystem: { enum: [ERP, CRM] }
        sourceCategoryId: { type: string, maxLength: 256 }
        categoryPath: { type: string, maxLength: 500, example: 邀约-百天-SS1 }
    PlannedTaskCategoryBinding:
      allOf:
        - $ref: '#/components/schemas/PlannedTaskCategoryBindingInput'
        - type: object
          required: [updatedBy, updatedAt]
          properties:
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    BaiyingScript:
      type: object
      required:
        [
          robotDefId,
          robotName,
          robotStatus,
          industryOneName,
          industryTwoName,
          deployTime,
          binding,
        ]
      properties:
        robotDefId: { type: string }
        robotName: { type: string }
        robotStatus: { type: integer, enum: [0, 1, 2, 3, 4, 5] }
        industryOneName: { type: string }
        industryTwoName: { type: string }
        deployTime: { type: string }
        binding:
          oneOf:
            - { $ref: '#/components/schemas/ScriptBinding' }
            - { type: 'null' }
    ScriptBindingInput:
      type: object
      required:
        [
          robotDefId,
          sourceSystem,
          categories,
          studioId,
          studioName,
          lineId,
          lineName,
        ]
      properties:
        robotDefId: { type: string, maxLength: 128 }
        sourceSystem: { enum: [ERP, CRM] }
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [sourceCategoryId, categoryPath]
            properties:
              sourceCategoryId: { type: string, maxLength: 256 }
              categoryPath:
                { type: string, maxLength: 500, example: 邀约-百天-SS1 }
        studioId: { type: string, maxLength: 128 }
        studioName: { type: string, maxLength: 200 }
        lineId: { type: string, maxLength: 128 }
        lineName: { type: string, maxLength: 200 }
    ScriptBinding:
      allOf:
        - $ref: '#/components/schemas/ScriptBindingInput'
        - type: object
          required: [updatedBy, updatedAt]
          properties:
            updatedBy: { type: string }
            updatedAt: { type: string, format: date-time }
    SourceCategoryObservation:
      type: object
      required: [sourceSystem, externalId, categoryPath, active]
      properties:
        sourceSystem: { enum: [ERP, CRM] }
        externalId: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 500 }
        categoryPath: { type: string, maxLength: 500, example: 邀约-百天-SS1 }
        level: { type: [integer, 'null'], minimum: 1 }
        parentId: { type: [string, 'null'], maxLength: 256 }
        active: { type: boolean, default: true }
        fields:
          type: object
          additionalProperties: true
